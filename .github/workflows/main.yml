name: CI - Lint, Test, Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Matches tags like v1.0.0, v0.1.0 etc.
  pull_request: # Also run on pull requests to main for checks
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: yourusername/n8n-workflow-generator # Replace with desired Docker Hub username/repo
                                                          # It's better to set this as a repository variable/secret if it changes often

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Should match Dockerfile base

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff # For linting

      - name: Lint with Ruff
        run: ruff check . --fix --show-source # Check, try to fix, and show source of issues

      - name: Test with pytest
        run: pytest tests/

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test # Only run if linting and tests pass
    # Only run on push to main or on new tags, not on pull requests for the build/push part
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=schedule,pattern=nightly # Example: if you had a nightly build
            type=ref,event=branch,pattern={{branch}}-{{sha}} # e.g., main-a1b2c3d
            type=ref,event=tag # Use the git tag itself, e.g., v1.0.0
            type=raw,value=latest,enable={{is_default_branch}} # Tag 'latest' on default branch (main)
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }} # Tag 'dev' on main branch pushes that are not tags

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
